load_module /tmp/waf-nginx-test/ngx_http_ebpf_waf_module.so;

user www-data;

daemon off;
pid /tmp/waf-nginx-test/nginx.pid;
error_log /tmp/waf-nginx-test/error.log notice;

events {
    worker_connections 32;
}

http {
    access_log /tmp/waf-nginx-test/access.log;
    ebpf_waf_verdict_map /sys/fs/bpf/ebpf-https-uprobe/request_verdicts;

    server {
        listen 127.0.0.1:13501 ssl;
        server_name localhost;
        ssl_certificate /tmp/waf-nginx-test/test.crt;
        ssl_certificate_key /tmp/waf-nginx-test/test.key;

        ebpf_waf_mode observe;
        ebpf_waf_on_verdict_unavailable allow;
        ebpf_waf_block_signatures TRAVERSAL_RAW TRAVERSAL_XML_ENTITY;

        location / {
            proxy_pass https://127.0.0.1:3501;
        
            proxy_ssl_server_name on;
            proxy_ssl_name 10.34.100.115;
            proxy_ssl_verify off;
        
            proxy_set_header Host 10.34.100.115:3501;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
